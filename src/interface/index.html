<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Survival Planner</title>
</head>
<body>
    <header>
        <h1>Cyborgnetical's School Nightmare Planner | C.S.N.P. ✩₊˚.⋆☾⋆⁺₊✧</h1>
    </header>
    <div id="classes">
        <ul id="classListing">
        </ul>
    </div>

    <form>
        <h2>Add new class</h2>
        <label for="class">Class Name:</label><br>
        <input type="text" name="class"><br>
        <label for="class-grade">Grade</label><br>
        <input type="number" name="class-grade">
        <button>Submit</button>
    </form>
    
    <script>
        async function sendData(route,data){
            fetch(route, {
                method:"POST",
                headers:{
                    'Content-Type': "application/json; charset=utf-8"
                },
                body:JSON.stringify(data)
            })
        }
        async function getData(route){
            let rawData = await fetch(route)
            let data = await rawData.json()
            return data;
        }
        // send data
        
        
        // I cant be bothered with async mess so just make a main function that is async
        async function main(){
            let classAssingments = await getData("/classes/Math/assingments")
            // fetch classes data
            let classes = await getData("/classes/getAllClasses")
            for(let i in classes){
                let classInfoBox = document.createElement("li")
                classInfoBox.innerText = `${i} - ${classes[i].grade}%`

                let classListing = document.getElementById("classListing")
                classListing.appendChild(classInfoBox)
            }

        }
        main();
    </script>
</body>
</html>
